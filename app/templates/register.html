{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>📝 Register</h1>
        <p class="subtitle">Create your account</p>

        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Ravi Kumar" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="9876543210" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Min 6 characters" required>
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="role">
                    <option value="customer">Customer</option>
                    <option value="admin">Admin (Shopkeeper)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>

        <p class="link">Already have an account? <a href="/login">Login here</a></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = await api('/api/auth/register', 'POST', {
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value,
        });
        if (data) {
            showToast('Registration successful! Please login.');
            setTimeout(() => { window.location.href = '/login'; }, 1000);
        }
    });
</script>
{% endblock %}
