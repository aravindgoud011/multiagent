<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Retail{% endblock %} — Kirana Store</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ─── Toastify CSS ─── */
        @import url('https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css');

        :root {
            --bg: #f4f6f8;
            --surface: #ffffff;
            --surface2: #f1f3f5;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-dim: #64748b;
            --primary: #0ea5e9;
            --primary-light: #38bdf8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --accent: #8b5cf6;
            --radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ─── Navbar ─── */
        .navbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .navbar .logo {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .navbar .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .navbar .user-info span { color: var(--text-dim); font-size: 0.9rem; }
        .btn-logout {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.4rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-logout:hover { background: var(--danger); color: white; }

        /* ─── Container ─── */
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        /* ─── Cards ─── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--primary-light);
        }

        /* ─── Stats Grid ─── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.2rem;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); border-color: var(--primary); }
        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--success));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card .stat-label { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.3rem; }

        /* ─── Forms ─── */
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 0.3rem;
            font-weight: 500;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: var(--primary); }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* ─── Buttons ─── */
        .btn {
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #7c6cf0);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(108,92,231,0.4); }
        .btn-success { background: var(--success); color: var(--bg); }
        .btn-success:hover { box-shadow: 0 4px 15px rgba(0,206,201,0.4); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { box-shadow: 0 4px 15px rgba(255,107,107,0.4); }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; }

        /* ─── Tables ─── */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.8rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        th {
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:hover { background: var(--surface2); }

        /* ─── Badges ─── */
        .badge {
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-success { background: rgba(0,206,201,0.15); color: var(--success); }
        .badge-danger { background: rgba(255,107,107,0.15); color: var(--danger); }
        .badge-warning { background: rgba(255,192,72,0.15); color: var(--warning); }
        .badge-primary { background: rgba(108,92,231,0.15); color: var(--primary-light); }

        /* ─── Tabs ─── */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 0.6rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.2s;
            font-weight: 500;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active {
            color: var(--primary-light);
            background: var(--surface2);
            border-bottom: 2px solid var(--primary);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ─── Custom Styles ─── */

        /* ─── Auth Pages ─── */
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
        }
        .auth-card h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-card .subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }
        .auth-card .btn { width: 100%; justify-content: center; margin-top: 0.5rem; }
        .auth-card .link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        .auth-card .link a { color: var(--primary-light); text-decoration: none; }
        .auth-card .link a:hover { text-decoration: underline; }

        /* ─── Modal ─── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h2 { margin-bottom: 1rem; }
        .modal-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        /* ─── Misc ─── */
        .text-dim { color: var(--text-dim); }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .mt-1 { margin-top: 1rem; }
        .mb-1 { margin-bottom: 1rem; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    {% block content %}{% endblock %}
    <script>
        // ─── Toast Notifications ───
        function showToast(message, type = 'success') {
            Toastify({
                text: message,
                duration: 3000,
                gravity: "bottom",
                position: "right",
                style: {
                    background: type === 'success' ? "var(--success)" : "var(--danger)",
                    borderRadius: "8px",
                    boxShadow: "0 4px 15px rgba(0,0,0,0.2)"
                }
            }).showToast();
        }

        // ─── Fetch Helper ───
        async function api(url, method = 'GET', body = null, suppressToast = false) {
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch(url, options);
            const data = await res.json();
            if (!res.ok) {
                if (res.status === 401 || res.status === 403) {
                    showToast(data.error || 'Access Denied. Please login again.', 'error');
                    setTimeout(() => { window.location.href = '/login'; }, 2000);
                    return null;
                }
                if (!suppressToast) {
                    showToast(data.error || 'Something went wrong', 'error');
                }
                return null;
            }
            return data;
        }

        // ─── Logout ───
        async function logout() {
            await api('/api/auth/logout', 'POST');
            window.location.href = '/login';
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
